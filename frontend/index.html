<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/AuthSphere(main).png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="AuthSphere" />
    <link rel="apple-touch-icon" href="assets/AuthSphere(main).png" />

    <!-- Primary Meta Tags -->
    <title>
      AuthSphere | Open-Source Authentication & OAuth Infrastructure
    </title>
    <meta
      name="title"
      content="AuthSphere | Open-Source Authentication & OAuth Infrastructure"
    />
    <meta
      name="description"
      content="Open-source authentication server and client SDK. Supports OAuth 2.0 with PKCE, Bcrypt password hashing, HaveIBeenPwned breach detection, and session management."
    />
    <meta
      name="keywords"
      content="authentication, auth, security, identity, oauth2, pkce, developer tools, react, nodejs, open-source"
    />
    <meta name="author" content="AuthSphere" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://authsphere.dev/" />
    <meta
      property="og:title"
      content="AuthSphere | Open-Source Authentication & OAuth Infrastructure"
    />
    <meta
      property="og:description"
      content="Open-source authentication server and client SDK. Supports OAuth 2.0 with PKCE, Bcrypt password hashing, HaveIBeenPwned breach detection, and session management."
    />
    <meta property="og:image" content="assets/AuthSphere(main).png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://authsphere.dev/" />
    <meta
      property="twitter:title"
      content="AuthSphere | Open-Source Authentication & OAuth Infrastructure"
    />
    <meta
      property="twitter:description"
      content="Open-source authentication server and client SDK. Supports OAuth 2.0 with PKCE, Bcrypt password hashing, HaveIBeenPwned breach detection, and session management."
    />
    <meta property="twitter:image" content="assets/AuthSphere(main).png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- Theme Color for Mobile Browsers -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          "Geist",
          system-ui,
          -apple-system,
          sans-serif;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
